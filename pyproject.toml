[build-system]
# setuptools 77 is the first release that understands the SPDX string license
# and license-files forms used below. Older versions reject the build.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-os"
version = "0.3.0"
description = "Personal cyberpunk OS shell with AI recommendations and a Litestar API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Raoof" }]
# Runtime dependencies use compatible-release ranges (PEP 440 `~=`): each floor
# is the version the test suite last ran against, and the range stops before
# the next major. Locking the full transitive set is tracked separately.
dependencies = [
  "cryptography~=50.0",
  "email-validator~=2.3",
  "google-genai~=3.0",
  "httpx~=0.28.1",
  "litestar~=2.25",
  "pydantic~=2.14",
  "pyjwt~=2.15",
  # Installed 4.0.0 is accepted explicitly; the floor is the tested 2.9 line.
  "python-dateutil>=2.9.0,<5",
  "python-dotenv~=1.2",
  "redis~=8.1",
  "sentry-sdk~=2.74",
  "supabase~=2.34",
  "tiktoken~=0.14",
  "uvicorn[standard]~=0.54",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8.3",
  "locust>=2.37.10",
  "pip-audit>=2.8.0",
  "anyio>=4.12.1",
  "pytest-asyncio>=0.23.8",
  "pytest>=9.0.3",
  "ruff>=0.11.13",
]

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:litestar.openapi.config.*:",
    "ignore:The base_url.*might cause issues:UserWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# ASYNC flags blocking calls inside async handlers (zero findings today).
# S, UP and RUF are deferred: they need per-file ignores and a fix pass first.
select = ["E", "F", "I", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
